<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JMA Weather Alerts / 気象警報・注意報</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 0; display: grid; grid-template-columns: 420px 1fr; height: 100vh; }
  aside { overflow: auto; padding: 12px 16px; border-right: 1px solid #ddd; }
  #map { height: 100vh; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  select, button { font: inherit; padding: 4px 8px; max-width: 100%; }
  .stale { background: #fff3cd; border: 1px solid #e0b000; padding: 6px 8px; margin: 8px 0; }
  .alert { border-left: 6px solid; padding: 4px 8px; margin: 4px 0; background: #fafafa; }
  .special { border-color: #4b0082; background: #1a1a1a; color: #fff; }
  .warning { border-color: #d7191c; } .advisory { border-color: #f2c200; }
  small { color: #666; } .special small { color: #ccc; }
  .legend { background: #fff; padding: 6px 8px; line-height: 1.6; }
  .legend i { display: inline-block; width: 12px; height: 12px; margin-right: 4px; border-radius: 50%; }
  @media (max-width: 800px) { body { grid-template-columns: 1fr; height: auto; } #map { height: 60vh; } }
</style>
</head>
<body>
<aside>
  <h1>気象警報・注意報 / JMA Weather Alerts</h1>
  <div class="controls">
    <button id="locate">📍 現在地 / Use my location</button>
    <label>都道府県 / Office <select id="office" aria-label="Office"></select></label>
    <label>地域 / Area <select id="area" aria-label="Area"><option value="">すべて / All</option></select></label>
    <button id="export">⬇ Markdown report</button>
  </div>
  <div id="status" role="status"></div>
  <div id="stale"></div>
  <p id="headline"></p>
  <h2>警報・注意報 / Active alerts</h2>
  <div id="alerts"></div>
  <h2>天気予報 / Forecast</h2>
  <div id="forecast"></div>
  <p><small>Data: 気象庁 Japan Meteorological Agency (bosai JSON). Map © OpenStreetMap contributors.</small></p>
</aside>
<div id="map"></div>
<script type="module" src="app.js"></script>
</body>
</html>
